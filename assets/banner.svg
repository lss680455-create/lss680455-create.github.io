<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 200" width="880" height="200" role="img" aria-label="EX. — 量化研究 · 研究流程工程">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#122039"/>
      <stop offset="1" stop-color="#1b2f54"/>
    </linearGradient>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0v44" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <clipPath id="round"><rect width="880" height="200" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="880" height="200" fill="url(#bg)"/>
    <rect width="880" height="200" fill="url(#grid)"/>
    <rect x="0" y="0" width="880" height="3" fill="url(#ac)"/>

    <polyline points="470,176 512,158 548,166 584,138 620,148 656,118 692,128 728,98 764,110 798,78 832,90 860,60"
              fill="none" stroke="url(#ac)" stroke-width="2.5" stroke-opacity="0.55"/>
    <polyline points="470,190 512,174 548,182 584,158 620,168 656,142 692,152 728,126 764,138 798,112 832,124 860,96"
              fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.22"/>
    <circle cx="798" cy="78" r="4" fill="#38bdf8" fill-opacity="0.8"/>
    <circle cx="860" cy="60" r="4" fill="#a855f7" fill-opacity="0.8"/>

    <rect x="56" y="76" width="6" height="60" rx="3" fill="url(#ac)"/>
    <text x="80" y="106" font-family="Segoe UI, PingFang SC, Hiragino Sans GB, Microsoft YaHei, Helvetica Neue, Arial, sans-serif"
          font-size="46" font-weight="700" fill="#ffffff" letter-spacing="1.5">EX.</text>
    <text x="82" y="134" font-family="Segoe UI, PingFang SC, Hiragino Sans GB, Microsoft YaHei, Helvetica Neue, Arial, sans-serif"
          font-size="15" fill="#a9c1db">量化研究 · 研究流程工程　|　Quant research &amp; research-ops</text>

    <g font-family="Segoe UI, PingFang SC, Hiragino Sans GB, Microsoft YaHei, Helvetica Neue, Arial, sans-serif" font-size="12.5">
      <rect x="80" y="150" width="98" height="27" rx="13.5" fill="#ffffff" fill-opacity="0.07" stroke="#38bdf8" stroke-opacity="0.35"/>
      <text x="129" y="168" text-anchor="middle" fill="#cfe3f7">研究方法论</text>
      <rect x="188" y="150" width="112" height="27" rx="13.5" fill="#ffffff" fill-opacity="0.07" stroke="#38bdf8" stroke-opacity="0.35"/>
      <text x="244" y="168" text-anchor="middle" fill="#cfe3f7">双市场数据层</text>
      <rect x="310" y="150" width="134" height="27" rx="13.5" fill="#ffffff" fill-opacity="0.07" stroke="#a855f7" stroke-opacity="0.35"/>
      <text x="377" y="168" text-anchor="middle" fill="#cfe3f7">任一 AI agent 可驱动</text>
    </g>
  </g>
</svg>
