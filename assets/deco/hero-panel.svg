<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 470" width="560" height="470" role="img" aria-label="HUD 装饰：终端窗口 + 合成器网格">
  <defs>
    <linearGradient id="nline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00E5FF"/>
      <stop offset="1" stop-color="#E6007A"/>
    </linearGradient>
    <linearGradient id="gsun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE3F1"/>
      <stop offset="1" stop-color="#FFB5DA"/>
    </linearGradient>
    <radialGradient id="sunglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E6007A" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#E6007A" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip1"><rect x="0" y="0" width="560" height="470"/></clipPath>
    <clipPath id="termclip"><rect x="34" y="30" width="340" height="152" rx="12"/></clipPath>
    <mask id="sunmask">
      <rect x="330" y="216" width="200" height="170" fill="#000"/>
      <circle cx="430" cy="300" r="64" fill="#fff"/>
      <rect x="346" y="306" width="168" height="5" fill="#000"/>
      <rect x="346" y="321" width="168" height="6" fill="#000"/>
      <rect x="346" y="338" width="168" height="7" fill="#000"/>
      <rect x="346" y="357" width="168" height="8" fill="#000"/>
      <rect x="346" y="378" width="168" height="9" fill="#000"/>
    </mask>
  </defs>

  <g clip-path="url(#clip1)">
    <!-- synthwave sun -->
    <ellipse cx="430" cy="300" rx="175" ry="125" fill="url(#sunglow)"/>
    <circle cx="430" cy="300" r="64" fill="url(#gsun)" mask="url(#sunmask)" opacity="0.95"/>

    <!-- perspective grid -->
    <g stroke="#22D3EE" stroke-opacity="0.38" stroke-width="1">
      <line x1="0" y1="318" x2="560" y2="318"/>
      <line x1="0" y1="330" x2="560" y2="330"/>
      <line x1="0" y1="344" x2="560" y2="344"/>
      <line x1="0" y1="360" x2="560" y2="360"/>
      <line x1="0" y1="380" x2="560" y2="380"/>
      <line x1="0" y1="404" x2="560" y2="404"/>
      <line x1="0" y1="432" x2="560" y2="432"/>
      <line x1="0" y1="464" x2="560" y2="464"/>
      <line x1="300" y1="310" x2="-120" y2="470"/>
      <line x1="300" y1="310" x2="-50" y2="470"/>
      <line x1="300" y1="310" x2="20" y2="470"/>
      <line x1="300" y1="310" x2="90" y2="470"/>
      <line x1="300" y1="310" x2="160" y2="470"/>
      <line x1="300" y1="310" x2="230" y2="470"/>
      <line x1="300" y1="310" x2="300" y2="470"/>
      <line x1="300" y1="310" x2="370" y2="470"/>
      <line x1="300" y1="310" x2="440" y2="470"/>
      <line x1="300" y1="310" x2="510" y2="470"/>
      <line x1="300" y1="310" x2="580" y2="470"/>
    </g>
    <g stroke="#E6007A" stroke-opacity="0.32" stroke-width="1">
      <line x1="0" y1="340" x2="560" y2="340"/>
      <line x1="0" y1="452" x2="560" y2="452"/>
    </g>
    <line x1="0" y1="310" x2="560" y2="310" stroke="url(#nline)" stroke-opacity="0.55" stroke-width="1.5"/>

    <!-- circuit decoration -->
    <g fill="none" stroke="#22D3EE" stroke-opacity="0.75" stroke-width="1.6">
      <path d="M34 240 H94 L114 220 H174"/>
      <path d="M114 220 V196"/>
    </g>
    <circle cx="34" cy="240" r="3" fill="#22D3EE"/>
    <circle cx="174" cy="220" r="3" fill="#22D3EE"/>
    <circle cx="114" cy="196" r="3" fill="#E6007A"/>

    <!-- crosshair -->
    <g stroke="#E6007A" stroke-opacity="0.6" fill="none">
      <circle cx="470" cy="150" r="14"/>
      <line x1="470" y1="130" x2="470" y2="170"/>
      <line x1="450" y1="150" x2="490" y2="150"/>
    </g>
    <circle cx="470" cy="150" r="2.2" fill="#E6007A"/>

    <!-- diamond -->
    <polygon points="500,240 508,248 500,256 492,248" fill="#7C3AED" fill-opacity="0.75"/>

    <!-- barcode -->
    <g fill="#0B0E1A" fill-opacity="0.7">
      <rect x="422" y="430" width="2" height="22"/>
      <rect x="427" y="430" width="4" height="22"/>
      <rect x="434" y="430" width="1.5" height="22"/>
      <rect x="438" y="430" width="3" height="22"/>
      <rect x="444" y="430" width="2" height="22"/>
      <rect x="449" y="430" width="1.5" height="22"/>
      <rect x="453" y="430" width="4" height="22"/>
      <rect x="460" y="430" width="2" height="22"/>
      <rect x="465" y="430" width="3" height="22"/>
      <rect x="471" y="430" width="1.5" height="22"/>
      <rect x="476" y="430" width="2" height="22"/>
      <rect x="481" y="430" width="3" height="22"/>
      <rect x="487" y="430" width="2" height="22"/>
      <rect x="492" y="430" width="4" height="22"/>
      <rect x="499" y="430" width="2" height="22"/>
    </g>
    <text x="546" y="464" text-anchor="end" font-family="Consolas, ui-monospace, monospace" font-size="9.5" fill="#8690A8">EX-2026-PORT</text>

    <!-- HUD labels -->
    <text x="300" y="22" text-anchor="middle" font-family="Consolas, ui-monospace, monospace" font-size="10" fill="#8690A8">31.2304°N · 121.4737°E</text>
    <circle cx="52" cy="448" r="3.5" fill="#00E676"/>
    <text x="62" y="452" font-family="Consolas, ui-monospace, monospace" font-size="10.5" fill="#4A5468">SYS.STATUS: ONLINE</text>

    <!-- corner brackets -->
    <g fill="none" stroke-width="2">
      <path d="M14 44 V14 H44" stroke="#06B6D4" stroke-opacity="0.9"/>
      <path d="M516 14 H546 V44" stroke="#E6007A" stroke-opacity="0.85"/>
      <path d="M14 426 V456 H44" stroke="#E6007A" stroke-opacity="0.85"/>
      <path d="M516 456 H546 V426" stroke="#06B6D4" stroke-opacity="0.9"/>
    </g>

    <!-- terminal window -->
    <g>
      <rect x="34" y="30" width="340" height="152" rx="12" fill="#FFFFFF"/>
      <g clip-path="url(#termclip)">
        <rect x="34" y="30" width="340" height="26" fill="#F2F5FB"/>
        <line x1="34" y1="56" x2="374" y2="56" stroke="#E4E8F4" stroke-width="1"/>
      </g>
      <rect x="34" y="30" width="340" height="152" rx="12" fill="none" stroke="#0B0E1A" stroke-opacity="0.14" stroke-width="1.5"/>
      <circle cx="52" cy="43" r="4" fill="#06B6D4"/>
      <circle cx="66" cy="43" r="4" fill="#E6007A"/>
      <circle cx="80" cy="43" r="4" fill="#7C3AED"/>
      <text x="100" y="47" font-family="Consolas, ui-monospace, monospace" font-size="10.5" fill="#69718A">mai --offline — terminal</text>
      <g font-family="Consolas, ui-monospace, monospace" font-size="12.2">
        <text x="50" y="86" fill="#0B0E1A">$ python -m mai AAPL --offline</text>
        <text x="50" y="108" fill="#39415A">Direction : <tspan fill="#C2185B" font-weight="bold">BUY</tspan> · Confidence: 0.445</text>
        <text x="50" y="130" fill="#39415A">Weights : 47.2% · 30.0% · 22.9%</text>
        <text x="50" y="152" fill="#69718A">Risk mode : RISK (consistency 0.069)</text>
        <text x="50" y="174" fill="#8690A8">zero API keys · fully offline</text>
      </g>
    </g>

    <!-- EX. lockup with glitch fringes -->
    <g font-family="Segoe UI, PingFang SC, Microsoft YaHei, Arial, sans-serif" font-weight="800" font-size="36" text-anchor="end">
      <text x="544" y="71" fill="#00E5FF" fill-opacity="0.5">EX.</text>
      <text x="540" y="73" fill="#FF2D95" fill-opacity="0.5">EX.</text>
      <text x="542" y="72" fill="#0B0E1A">EX.</text>
    </g>
    <text x="542" y="90" text-anchor="end" font-family="Consolas, ui-monospace, monospace" font-size="10" fill="#8690A8">PORTFOLIO · v1.0</text>
  </g>
</svg>
